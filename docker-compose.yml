services:
  # -------------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: project_hall_db
    restart: always
    ports:
      - "127.0.0.1:5433:5432" # 5433 bound to localhost only (prevents public 0.0.0.0 exposure)
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-project_hall}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-project_hall}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------
  # Express Backend (Auth API)
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: project_hall_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      PGHOST: db # service name on Docker internal network
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-project_hall}
      JWT_ISSUER: http://localhost:5000
      JWT_AUDIENCE: http://localhost:5173
      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback
      FRONTEND_URL: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET}
      USE_HTTPS: "${USE_HTTPS:-false}"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/init.sql:/app/init.sql
      - ./backend/.keys:/app/.keys
      - ./backend/.certs:/app/.certs
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy # Wait for Postgres to actually accept connections

volumes:
  postgres_data:
  uploads_data:
